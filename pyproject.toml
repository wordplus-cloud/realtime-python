[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wordplus-realtime"
version = "1.0.0"
description = "WordPlus Cloud's realtime SDK for Python outside WordPress: rooms with presence and history, online status, events to rooms and users, webhooks, calls between two people that ring in the browser, group calls, sealed end to end. Signs what the browser package (@wordplus/realtime) asks for and emits; Django, FastAPI and Flask included, and the browser files served from its own routes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WordPlus" }]
keywords = ["realtime", "websocket", "rooms", "presence", "webrtc", "video calls", "django", "fastapi", "flask", "end-to-end encryption"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Communications",
]
dependencies = ["pynacl>=1.5"]

[project.urls]
Homepage = "https://docs.wordplus.cloud/django/getting-started/"
Documentation = "https://docs.wordplus.cloud/apps/python-reference/"
Source = "https://github.com/wordplus-cloud/realtime-python"

[project.optional-dependencies]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=3.0"]
test = ["pytest>=8", "django>=4.2", "fastapi>=0.100", "httpx>=0.27", "flask>=3.0", "flask-login>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/wordplus_realtime"]

# The source distribution: the package, its spec and tests, never the app the end-to-end check serves.
[tool.hatch.build.targets.sdist]
exclude = ["examples/check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
