{% load static %}<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · API demo</title>
    <link rel="stylesheet" href="{% static 'shop.css' %}">
</head>
<body>
    <main class="sign-in">
        <h1>API demo</h1>
        <p class="muted">Sign in as Ann, Ben or Cara. Use another browser, or a private window, for a second person.</p>
        <form method="post">
            {% csrf_token %}
            {% for person in people %}
                <button name="as" value="{{ person.user_id }}"><img class="avatar" src="{{ person.avatar }}" alt="" width="28" height="28"> {{ person.user.first_name }} <small>{{ person.role }}</small></button>
            {% endfor %}
        </form>
    </main>
</body>
</html>
